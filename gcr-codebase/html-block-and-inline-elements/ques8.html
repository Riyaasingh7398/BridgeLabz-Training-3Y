<!DOCTYPE html>
<html>
<head>
    <title>Student Report</title>
</head>
<body>

    <h1>Lucknow Public School</h1>

    <h2>Student Report</h2>

    <table border="1" title="Student Marks Report">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Computer</td>
            <td>100</td>
            <td>95</td>
        </tr>

        <tr>
            <td>Hindi</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <th>Total</th>
            <td colspan="2">440 / 500</td>
        </tr>

        <tr>
            <th>Percentage</th>
            <td colspan="2" title="Percentage of total marks">88%</td>
        </tr>

    </table>

</body>
</html>
