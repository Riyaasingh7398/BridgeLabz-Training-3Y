<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Choose Your Travel Destination</h1>

    <label>Country:</label>

    <select>
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
        <option>Australia</option>
    </select>

    <br><br>
    <label>State:</label>

    <select>
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Kerala</option>
    </select>

    <br><br>
    <label>City:</label>

    <select>
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>

    <br><br>
    <label>Favorite Tourist Place:</label>

    <select>
        <option selected>Vrindavan</option>
        <option>Taj Mahal</option>
        <option>Goa Beach</option>
        <option>Kerala Backwaters</option>
    </select>

    <br><br>

    <p>
        My choices are: India, Uttar Pradesh, Mathura,
        and my favorite tourist place is Vrindavan.
    </p>

</body>
</html>
