<!DOCTYPE html>
<html>
<head>
    <title>Q2 - Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Live Character Counter</h1>
    <textarea id="message" maxlength="100" rows="6" placeholder="Type your message (maximum 100 characters)"></textarea>
    <p>Remaining characters: <span id="counter">100</span></p>
    <button id="resetButton">Reset</button>
</div>
<script src="script.js"></script>
</body>
</html>
