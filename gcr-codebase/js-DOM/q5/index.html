<!DOCTYPE html>
<html>
<head>
    <title>Q5 - Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Image Gallery</h1>
    <div id="gallery" class="gallery">
        <img src="https://picsum.photos/id/1015/300/200" alt="Mountain">
        <img src="https://picsum.photos/id/1016/300/200" alt="Nature">
        <img src="https://picsum.photos/id/1025/300/200" alt="Dog">
        <img src="https://picsum.photos/id/1035/300/200" alt="River">
        <img src="https://picsum.photos/id/1043/300/200" alt="Forest">
        <img src="https://picsum.photos/id/106/300/200" alt="Beach">
    </div>
</div>

<div id="modal" class="modal">
    <span id="closeModal" class="close">&times;</span>
    <img id="modalImage" alt="Selected image preview">
</div>

<script src="script.js"></script>
</body>
</html>
