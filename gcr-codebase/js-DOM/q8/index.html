<!DOCTYPE html>
<html>
<head>
    <title>Q8 - Custom Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Custom Dropdown</h1>
    <div class="dropdown" id="dropdown">
        <button id="dropdownButton">Select a course</button>
        <div id="dropdownOptions" class="options hidden">
            <div class="option">Cloud Computing</div>
            <div class="option">JavaScript</div>
            <div class="option">Python</div>
            <div class="option">DevOps</div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
