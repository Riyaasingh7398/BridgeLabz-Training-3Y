<!DOCTYPE html>
<html>
<head>
    <title>Q4 - Theme Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
<div class="container">
    <h1>Theme Switcher</h1>
    <p>Choose a theme for this page.</p>
    <button data-theme-choice="light">Light</button>
    <button data-theme-choice="dark">Dark</button>
    <button data-theme-choice="blue">Blue</button>
    <p id="currentTheme">Current theme: Light</p>
</div>
<script src="script.js"></script>
</body>
</html>
