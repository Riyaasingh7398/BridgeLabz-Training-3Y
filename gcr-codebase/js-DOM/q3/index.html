<!DOCTYPE html>
<html>
<head>
    <title>Q3 - Multi-Step Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Multi-Step Registration Form</h1>

    <section id="step1">
        <h3>Step 1: Name</h3>
        <input id="name" placeholder="Enter your name">
        <button id="next1">Next</button>
    </section>

    <section id="step2" class="hidden">
        <h3>Step 2: Email</h3>
        <input id="email" type="email" placeholder="Enter your email">
        <button id="back2">Back</button>
        <button id="next2">Next</button>
    </section>

    <section id="step3" class="hidden">
        <h3>Step 3: Password</h3>
        <input id="password" type="password" placeholder="At least 6 characters">
        <button id="back3">Back</button>
        <button id="finish">Submit</button>
    </section>

    <section id="summary" class="hidden">
        <h2>Registration Summary</h2>
        <p id="summaryName"></p>
        <p id="summaryEmail"></p>
        <p class="success">All steps completed successfully!</p>
    </section>
</div>
<script src="script.js"></script>
</body>
</html>
