<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting</title>
</head>
<body>
    <p>
        I am a <strong>student</strong> who loves
        <em>learning new things</em>.
        <mark>HTML is interesting!</mark>
        <small>Keep learning every day.</small>
        <br>
        Practice makes us better.
    </p>
</body>
</html>
